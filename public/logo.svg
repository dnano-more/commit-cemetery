<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background / Glow Gradients -->
    <linearGradient id="tombstoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070f" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="ghostGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Ectoplasm Glow Behind Tombstone -->
  <ellipse cx="100" cy="110" rx="75" ry="65" fill="#9333ea" opacity="0.25" filter="url(#glowFilter)" />
  <circle cx="100" cy="90" r="50" fill="#10b981" opacity="0.15" filter="url(#glowFilter)" />

  <!-- Tombstone Base Mound / Ground -->
  <path d="M 25 170 Q 100 155 175 170 L 180 185 Q 100 190 20 185 Z" fill="#090d16" stroke="#334155" stroke-width="2" />
  <ellipse cx="100" cy="172" rx="65" ry="8" fill="#1e293b" opacity="0.6" />

  <!-- Tombstone Body -->
  <path d="M 45 165 L 45 70 C 45 35 155 35 155 70 L 155 165 Z" fill="url(#tombstoneGrad)" stroke="url(#neonGlow)" stroke-width="3.5" stroke-linejoin="round" />

  <!-- Tombstone Cracks -->
  <path d="M 60 48 L 72 60 L 68 70 L 80 82" stroke="#6b21a8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.7" />
  <path d="M 140 120 L 132 130 L 136 142" stroke="#475569" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6" />

  <!-- R.I.P. Inscription -->
  <text x="100" y="72" font-family="monospace" font-size="13" font-weight="900" fill="#e2e8f0" text-anchor="middle" letter-spacing="4" opacity="0.85">R.I.P.</text>

  <!-- Git Commit Tree Branch Carved Inside (The Ghost in the Machine) -->
  <g filter="url(#glowFilter)">
    <!-- Branch Lines -->
    <path d="M 100 85 L 100 145" stroke="#a855f7" stroke-width="3" stroke-linecap="round" />
    <path d="M 100 105 Q 125 108 125 125 L 125 135" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Commit Nodes -->
    <!-- Top Commit (HEAD) -->
    <circle cx="100" cy="88" r="6" fill="#0f172a" stroke="#c084fc" stroke-width="3" />
    <circle cx="100" cy="88" r="2.5" fill="#f3e8ff" />

    <!-- Merge / Feature Commit (Divergence) -->
    <circle cx="125" cy="125" r="5" fill="#0f172a" stroke="#34d399" stroke-width="2.5" />
    <circle cx="125" cy="125" r="2" fill="#ecfdf5" />

    <!-- Mid Commit -->
    <circle cx="100" cy="115" r="5" fill="#0f172a" stroke="#c084fc" stroke-width="2.5" />
    <circle cx="100" cy="115" r="2" fill="#f3e8ff" />

    <!-- Root Commit (Genesis) -->
    <circle cx="100" cy="142" r="6" fill="#0f172a" stroke="#a855f7" stroke-width="3" />
    <circle cx="100" cy="142" r="2.5" fill="#c084fc" />
  </g>

  <!-- Ghost Vapor / Ethereal Flame Rising -->
  <path d="M 100 35 C 92 25 108 15 100 5 C 112 18 102 28 100 35 Z" fill="url(#ghostGlow)" filter="url(#glowFilter)" />

  <!-- Ghost Eyes on Tombstone -->
  <circle cx="88" cy="98" r="1.5" fill="#34d399" opacity="0.9" />
  <circle cx="112" cy="98" r="1.5" fill="#34d399" opacity="0.9" />
</svg>

